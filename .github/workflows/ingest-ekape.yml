# 축평원 정기 수집 (.scratch/ingest-schedule/issues/11, pipeline.md 5-1).
# 매일 06:40 KST에 기준일의 D-1과 다시 받기 D-2·D-3을 받는다. 축종 7개 × 3일 = 21회 (실행당 예산 800).
# 수동 실행에서 date(YYYY-MM-DD, 기준일)를 줄 수 있다. 비우면 오늘(KST).
name: ingest-ekape

on:
  schedule:
    - cron: "40 21 * * *" # KST 06:40
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 (YYYY-MM-DD). 비우면 오늘(KST)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest-ekape
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.ingest.outputs.code }}
    timeout-minutes: 15 # 21회 + 다시 부르기
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/price-ingest..."
      # 비밀값은 이 단계의 env로만 넘긴다. CLI가 인코딩 변형까지 ::add-mask::로 더한다 (ingest-schedule/02)
      # 입력값은 run 줄에 직접 넣지 않고 env로 넘긴다 (스크립트 주입 방지). 형식은 CLI가 검사한다
      - name: 수집
        id: ingest
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          BASE_DATE: ${{ inputs.date }}
        run: |
          args=()
          if [ -n "$BASE_DATE" ]; then args+=(--date "$BASE_DATE"); fi
          set +e # 종료 코드를 알림 잡에 넘기고 그대로 끝낸다
          pnpm --filter @workspace/price-ingest ingest --source ekape "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      # 평소가 (judgment.md 1·2장): KAMIS 실행이 먼저 끝나 축평원 시세의 그날 평소가가 비므로 여기서도 최근 7일을 다시 낸다
      - name: 평소가
        if: ${{ !cancelled() }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: pnpm --filter @workspace/price-ingest usual
      # 판정 묶음 (ingest-foundation/11): 평소가와 시세로 판정을 새로 만들고, 검사를 넘으면 화면이 읽는 포인터를 바꾼다
      - name: 판정
        if: ${{ !cancelled() }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: pnpm --filter @workspace/price-ingest judgment --trigger ekape

  # 3년 백필 (ingest-foundation/04): 정기 수집이 성공한 정기 실행에서만 하루 예산 900회씩 이어 받는다.
  # 축평원 한도는 하루 1,000회라 다 받는 데 열흘 남짓 걸린다. 다 받은 뒤에는 실행 기록 없이 바로 끝난다.
  # 수동 실행에서는 돌지 않는다 (같은 날 두 번 돌면 한도를 넘겨 다음 날 정기 수집까지 막힌다).
  # 실패해도 워크플로를 실패로 두지 않는다: 알림 잡이 "직전 실행이 실패였나"를 워크플로 결과로 본다.
  # 키·DB·Storage 장애는 앞의 정기 수집이 먼저 알린다. 진행은 price.backfill_task로 본다
  backfill:
    needs: ingest
    # 수집 단계의 종료 코드로 본다. 뒤의 평소가 · 판정 단계가 실패해도 백필은 이어 받는다
    if: ${{ github.event_name == 'schedule' && needs.ingest.outputs.code == '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 900회 × 약 1초 + 묶음 적재
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/price-ingest..."
      - name: 백필
        id: backfill
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: |
          set +e
          pnpm --filter @workspace/price-ingest backfill --source ekape --budget 900
          code=$?
          # 1(예산을 다 씀·일부 묶음 실패)은 다음 날 이어 받는 정상 진행이라 초록으로 둔다
          if [ "$code" -eq 1 ]; then exit 0; fi
          exit $code
      # 이번 실행이 마지막 묶음을 끝냈으면 평소가 6개월과 계절비율을 다시 낸다 (매일 실행은 최근 7일만 낸다).
      # 축산 규격은 이력이 차야 판정 전에서 벗어난다 (judgment.md 7장)
      - name: 평소가 6개월 다시 내기
        if: ${{ steps.backfill.outputs.finished == 'true' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: pnpm --filter @workspace/price-ingest usual --days 182
      # 판정 묶음 (ingest-foundation/11): 평소가와 시세로 판정을 새로 만들고, 검사를 넘으면 화면이 읽는 포인터를 바꾼다
      - name: 판정
        if: ${{ steps.backfill.outputs.finished == 'true' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: pnpm --filter @workspace/price-ingest judgment --trigger ekape-backfill

  # 실패 알림 (ingest-schedule/13): 키 오류·원본 저장 실패는 즉시, 그 밖의 실패는 직전 실행도 실패였을 때 이슈를 열거나 댓글을 단다.
  # 성공하면 이 출처의 열린 알림 이슈를 닫는다. 이슈 권한은 이 잡에만 준다. 비밀값은 넘기지 않는다
  alert:
    needs: ingest
    if: ${{ always() && needs.ingest.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # 직전 실행이 실패였는지 본다
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/price-ingest..."
      - name: 알림
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 수집은 성공했는데 뒤 단계(평소가·판정)가 실패하면 예상하지 못한 실패(9)로 알린다
          EXIT_CODE: ${{ needs.ingest.outputs.code == '0' && needs.ingest.result == 'failure' && '9' || needs.ingest.outputs.code }}
        run: pnpm --filter @workspace/price-ingest alert --source ekape --workflow ingest-ekape.yml --exit-code "$EXIT_CODE"
