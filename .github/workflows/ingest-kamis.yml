# KAMIS 정기 수집 (.scratch/ingest-schedule/issues/11, pipeline.md 5-1).
# 매일 06:30 KST에 기준일의 D-3~D-1을, 매주 월요일 07:10 KST에 D-14~D-1을 다시 받는다 (재등록 보조).
# 월요일 실행은 끝에 보존 정리(KAMIS 90일, 참가격 6 조사일. 요약이 있는 날만)를 한다 (ingest-foundation/10).
# 품목 140개 × 기간 호출 1회 (축산은 페이지가 늘어난다). 실행당 호출 예산 8,000 (하루 한도 10,000).
# 매일 09:30 KST에 한 번 더 깨어, 오늘(KST) 성공한 실행이 없을 때만 다시 받는다. 러너에 따라 data.go.kr에 전혀 닿지 않는
# 날이 있어서다 (2026-10-28. CLI는 닿지 않으면 몇 분 안에 unreachable로 멈춘다). 다시 돌면 대개 다른 러너를 받는다.
# 수동 실행에서 date(YYYY-MM-DD, 기준일)와 recheck_days를 줄 수 있다. 비우면 오늘·매일 수집.
name: ingest-kamis

on:
  schedule:
    - cron: "30 21 * * *" # KST 06:30 매일
    - cron: "10 22 * * 0" # KST 월 07:10 주간 다시 받기
    - cron: "30 0 * * *" # KST 09:30 오늘 성공한 실행이 없으면 다시 받기. 예약 실행이 3시간가량 늦게 도는 것을 보고 06:30에서 3시간 띄운다
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 (YYYY-MM-DD). 비우면 오늘(KST)"
        required: false
        default: ""
      recheck_days:
        description: "다시 받을 날 수 (1~31). 비우면 매일 수집(D-3~D-1)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read # 다시 받기 전에 오늘 성공한 실행이 있는지 본다

concurrency:
  group: ingest-kamis
  cancel-in-progress: false

jobs:
  # 09:30 다시 받기만 본다. 오늘(KST 0시 이후) 성공한 실행이 있으면 수집을 건너뛴다. 주간 다시 받기 성공도 오늘 범위를 덮으므로 센다
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - id: today
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RETRY: ${{ github.event.schedule == '30 0 * * *' }}
        run: |
          if [ "$RETRY" != "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since="$(TZ=Asia/Seoul date +%F)T00:00:00+09:00"
          done=$(gh run list --workflow ingest-kamis.yml --status success --created ">=$since" --json databaseId --jq length)
          echo "오늘 성공한 실행: ${done}개"
          if [ "$done" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  ingest:
    needs: gate
    if: ${{ needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 약 150회 × 1초 + 다시 부르기
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/price-ingest..."
      # 비밀값은 이 단계의 env로만 넘긴다. CLI가 인코딩 변형까지 ::add-mask::로 더한다 (ingest-schedule/02)
      # 입력값은 run 줄에 직접 넣지 않고 env로 넘긴다 (스크립트 주입 방지). 형식은 CLI가 검사한다
      - name: 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          BASE_DATE: ${{ inputs.date }}
          RECHECK_DAYS: ${{ github.event.schedule == '10 22 * * 0' && '14' || inputs.recheck_days }}
        run: |
          args=()
          if [ -n "$BASE_DATE" ]; then args+=(--date "$BASE_DATE"); fi
          if [ -n "$RECHECK_DAYS" ]; then args+=(--recheck-days "$RECHECK_DAYS"); fi
          pnpm --filter @workspace/price-ingest ingest --source kamis "${args[@]}"
      # 주 1회 보존 정리. 수집이 부분 실패해도 정리는 한다 (요약이 없는 날은 함수가 지우지 않는다)
      - name: 보존 정리
        if: ${{ !cancelled() && github.event.schedule == '10 22 * * 0' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: pnpm --filter @workspace/price-ingest purge
