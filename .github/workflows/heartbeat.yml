# 주 1회 heartbeat (.scratch/ingest-schedule/issues/14, pipeline.md 5-3-1).
# 공개 저장소는 60일 동안 활동이 없으면 예약 워크플로를 끈다. 매일 수집이 돌아도 커밋이 없으면 꺼진다.
# 꺼진 수집 워크플로를 다시 켜고, 출처별로 마지막 수집이 멈췄거나 Supabase가 일시정지됐으면 알림 이슈를 연다 (13과 같은 이슈 묶기).
# heartbeat 자신도 같은 규칙으로 꺼질 수 있다. 사람이 확인할 날은 14 Answer에 있다.
name: heartbeat

on:
  schedule:
    - cron: "0 2 * * 3" # KST 수 11:00 (매일 수집과 09:30 다시 받기가 끝난 뒤)
  workflow_dispatch:

permissions:
  contents: read
  actions: write # 꺼진 수집 워크플로를 다시 켠다
  issues: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/price-ingest..."
      # 비밀값은 이 단계의 env로만 넘긴다. CLI가 인코딩 변형까지 ::add-mask::로 더한다 (ingest-schedule/02)
      - name: 점검
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: pnpm --filter @workspace/price-ingest heartbeat
