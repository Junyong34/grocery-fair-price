# 참가격 정기 수집 (.scratch/ingest-schedule/issues/12, pipeline.md 5-1).
# 매일 07:00 KST에 자동 모드로 돈다: 최근 금요일 2개를 감지·완료 규칙대로 받고(10), 남는 예산으로 지난 조사일을
# 2026-06-12부터 오래된 것부터 채운다(12). 실행당 호출 예산 1,500 (하루 한도 2,000).
# 수동 실행에서 survey_days(공백으로 구분한 YYYY-MM-DD)를 주면 그 조사일만 받는다.
name: ingest-chamga

on:
  schedule:
    - cron: "0 22 * * *" # KST 07:00
  workflow_dispatch:
    inputs:
      survey_days:
        description: "받을 조사일 (YYYY-MM-DD, 공백으로 구분). 비우면 자동 모드"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest-chamga
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.ingest.outputs.code }}
    timeout-minutes: 60 # 1,500회 × 약 1초 + 다시 부르기
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/price-ingest..."
      # 비밀값은 이 단계의 env로만 넘긴다. CLI가 인코딩 변형까지 ::add-mask::로 더한다 (ingest-schedule/02)
      # 입력값은 run 줄에 직접 넣지 않고 env로 넘긴다 (스크립트 주입 방지). 형식은 CLI가 검사한다
      - name: 수집
        id: ingest
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          SURVEY_DAYS: ${{ inputs.survey_days }}
        run: |
          args=()
          for day in $SURVEY_DAYS; do args+=(--survey-day "$day"); done
          set +e # 종료 코드를 알림 잡에 넘기고 그대로 끝낸다
          pnpm --filter @workspace/price-ingest ingest --source chamga "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      # 판정 묶음 (ingest-foundation/11): 평소가와 시세로 판정을 새로 만들고, 검사를 넘으면 화면이 읽는 포인터를 바꾼다
      - name: 판정
        if: ${{ !cancelled() }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: pnpm --filter @workspace/price-ingest judgment --trigger chamga

  # 실패 알림 (ingest-schedule/13): 키 오류·원본 저장 실패는 즉시, 그 밖의 실패는 직전 실행도 실패였을 때 이슈를 열거나 댓글을 단다.
  # 성공하면 이 출처의 열린 알림 이슈를 닫는다. 이슈 권한은 이 잡에만 준다. 비밀값은 넘기지 않는다
  alert:
    needs: ingest
    if: ${{ always() && needs.ingest.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # 직전 실행이 실패였는지 본다
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/price-ingest..."
      - name: 알림
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 수집은 성공했는데 뒤 단계(판정)가 실패하면 예상하지 못한 실패(9)로 알린다
          EXIT_CODE: ${{ needs.ingest.outputs.code == '0' && needs.ingest.result == 'failure' && '9' || needs.ingest.outputs.code }}
        run: pnpm --filter @workspace/price-ingest alert --source chamga --workflow ingest-chamga.yml --exit-code "$EXIT_CODE"
